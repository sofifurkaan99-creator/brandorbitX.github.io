<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pricing | BrandOrbitX</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
  :root{
    --void:#06080f;
    --panel:#0d1426;
    --panel-2:#111a32;
    --primary:#7c5cff;
    --primary-soft:rgba(124,92,255,.12);
    --accent:#ff6b4a;
    --cyan:#6fd4ff;
    --text:#e8eaf2;
    --muted:#8088a0;
    --line:rgba(255,255,255,.08);
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  html{scroll-behavior:smooth;}
  body{
    background:var(--void); color:var(--text);
    font-family:'Inter',-apple-system,sans-serif;
    -webkit-font-smoothing:antialiased;
    overflow-x:hidden;
  }
  .mono{ font-family:'JetBrains Mono',monospace; }
  a:focus-visible, button:focus-visible{ outline:2px solid var(--primary); outline-offset:3px; }

  /* particles canvas (site-wide background) */
  #particles{
    position:fixed; inset:0; z-index:0;
    pointer-events:none;
  }

  /* ambient background matched to home.html for consistent visuals */
  .ambient{
    position:fixed; inset:0; z-index:0; pointer-events:none;
    background:
      radial-gradient(ellipse 900px 600px at 50% -5%, rgba(124,92,255,.22), transparent 60%),
      radial-gradient(ellipse 600px 400px at 90% 20%, rgba(255,107,74,.1), transparent 60%),
      radial-gradient(ellipse 500px 500px at 5% 80%, rgba(111,212,255,.06), transparent 60%);
  }

  nav{
    position:sticky; top:0; z-index:50;
    display:flex; align-items:center; justify-content:space-between;
    padding:18px 6%;
    background:rgba(6,8,15,.78);
    backdrop-filter:blur(16px);
    border-bottom:1px solid var(--line);
  }
  .logo{ display:flex; align-items:center; gap:9px; font-weight:700; text-decoration:none; color:var(--text); }
  .logo .dot{ width:8px;height:8px;border-radius:50%;background:var(--accent); box-shadow:0 0 10px var(--accent); }
  nav a.back{ color:var(--muted); text-decoration:none; font-size:13px; font-weight:600; display:flex; align-items:center; gap:6px; transition:.3s; }
  nav a.back:hover{ color:var(--text); }

  header{
    position:relative;
    text-align:center;
    padding:70px 6% 50px;
    overflow:hidden;
  }
  .eyebrow{
    display:inline-flex; align-items:center; gap:8px;
    font-family:'JetBrains Mono',monospace;
    font-size:12px; letter-spacing:2px; text-transform:uppercase;
    color:var(--muted);
    border:1px solid var(--line);
    padding:7px 16px; border-radius:50px;
    margin-bottom:24px;
  }
  .eyebrow .dot{ width:6px;height:6px;border-radius:50%;background:var(--accent); }
  header h1{
    font-size:clamp(2rem, 5.5vw, 3.2rem);
    font-weight:800; letter-spacing:-1.5px;
  }
  header h1 span{
    background:linear-gradient(100deg, var(--primary), #b8a3ff 50%, var(--accent));
    -webkit-background-clip:text; -webkit-text-fill-color:transparent; background-clip:text;
  }
  header p{
    color:var(--muted); margin-top:16px; max-width:520px; margin-inline:auto;
    font-size:1.05rem; line-height:1.6;
  }

  /* rest of existing CSS left unchanged */
</style>
</head>
<body>

<canvas id="particles"></canvas>
<div class="ambient"></div>

<nav>
  <a href="home.html" class="logo"><span class="dot"></span>BrandOrbitX</a>
  <a href="dashboard.html" class="back"><i class="fas fa-arrow-left"></i> Designs</a>
</nav>

<header>
  <span class="eyebrow"><span class="dot"></span>Pricing</span>
  <h1>Simple pricing for<br><span>every stage</span> of your business</h1>
  <p>Three tiers, transparent starting prices. Pick the one that fits — every plan includes a fully responsive, launch-ready website.</p>
</header>

<!-- original page content continues unchanged -->

<footer><p>© 2026 BrandOrbitX | All Rights Reserved</p></footer>

<script>
  // PARTICLES (copied from home.html)
  const canvas = document.getElementById('particles');
  const ctx = canvas.getContext('2d');
  let W, H, particles = [];
  function resize(){ W = canvas.width = window.innerWidth; H = canvas.height = window.innerHeight; }
  resize();
  window.addEventListener('resize', resize);
  class Particle{
    constructor(){
      this.x = Math.random()*W; this.y = Math.random()*H;
      this.size = Math.random()*1.5+0.3;
      this.vx = (Math.random()-.5)*.3; this.vy = (Math.random()-.5)*.3;
      this.alpha = Math.random()*.6+.1;
      const c = ['rgba(124,92,255,','rgba(111,212,255,','rgba(255,107,74,','rgba(232,234,242,'];
      this.color = c[Math.floor(Math.random()*c.length)];
    }
    draw(){ ctx.beginPath(); ctx.arc(this.x,this.y,this.size,0,Math.PI*2); ctx.fillStyle=this.color+this.alpha+')'; ctx.fill(); }
    update(){
      this.x+=this.vx; this.y+=this.vy;
      if(this.x<0||this.x>W) this.vx*=-1;
      if(this.y<0||this.y>H) this.vy*=-1;
    }
  }
  particles = [];
  for(let i=0;i<90;i++) particles.push(new Particle());
  function drawLines(){
    for(let i=0;i<particles.length;i++){
      for(let j=i+1;j<particles.length;j++){
        const dx=particles[i].x-particles[j].x, dy=particles[i].y-particles[j].y;
        const d=Math.sqrt(dx*dx+dy*dy);
        if(d<120){ ctx.beginPath(); ctx.moveTo(particles[i].x,particles[i].y); ctx.lineTo(particles[j].x,particles[j].y); ctx.strokeStyle=`rgba(124,92,255,${.08*(1-d/120)})`; ctx.lineWidth=.5; ctx.stroke(); }
      }
    }
  }
  function animate(){ ctx.clearRect(0,0,W,H); particles.forEach(p=>{p.update();p.draw();}); drawLines(); requestAnimationFrame(animate); }
  animate();
</script>
</body>
</html>
