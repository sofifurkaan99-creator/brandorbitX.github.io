<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BrandOrbitX | Elite Dashboard</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
  :root{
    --void:#06080f;
    --panel:#0d1426;
    --panel-2:#111a32;
    --panel-3:#16213f;
    --primary:#7c5cff;
    --primary-soft:rgba(124,92,255,.12);
    --accent:#ff6b4a;
    --cyan:#6fd4ff;
    --text:#e8eaf2;
    --muted:#8088a0;
    --line:rgba(255,255,255,.08);
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  html{scroll-behavior:smooth;}
  body{
    background:var(--void); color:var(--text);
    font-family:'Inter',-apple-system,sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  .mono{ font-family:'JetBrains Mono',monospace; }
  a:focus-visible, button:focus-visible{ outline:2px solid var(--primary); outline-offset:3px; }

  /* particles canvas (site-wide background) */
  #particles{
    position:fixed; inset:0; z-index:0;
    pointer-events:none;
  }

  /* ambient background (from home.html) */
  .ambient{
    position:fixed; inset:0; z-index:0; pointer-events:none;
    background:
      radial-gradient(ellipse 900px 600px at 50% -5%, rgba(124,92,255,.22), transparent 60%),
      radial-gradient(ellipse 600px 400px at 90% 20%, rgba(255,107,74,.1), transparent 60%),
      radial-gradient(ellipse 500px 500px at 5% 80%, rgba(111,212,255,.06), transparent 60%);
  }

  nav.topnav{
    position:sticky; top:0; z-index:80;
    display:flex; align-items:center; justify-content:space-between;
    padding:18px 6%;
    background:rgba(6,8,15,.78);
    backdrop-filter:blur(16px);
    border-bottom:1px solid var(--line);
  }
  .logo{ display:flex; align-items:center; gap:9px; font-weight:700; text-decoration:none; color:var(--text); }
  .logo .dot{ width:8px;height:8px;border-radius:50%;background:var(--accent); box-shadow:0 0 10px var(--accent); }
  nav.topnav a.back{ color:var(--muted); text-decoration:none; font-size:13px; font-weight:600; display:flex; align-items:center; gap:6px; transition:.3s; }
  nav.topnav a.back:hover{ color:var(--text); }

  .header{
    position:relative;
    text-align:center;
    padding:60px 20px 0;
    overflow:hidden;
  }
  .header::before{
    content:'';
    position:absolute; top:-100px; left:50%; transform:translateX(-50%);
    width:600px; height:400px;
    background:radial-gradient(ellipse, rgba(124,92,255,.22), transparent 65%);
    pointer-events:none;
  }
  .header-orbit{
    position:relative;
    width:140px; height:140px;
    margin:0 auto 18px;
    display:flex; align-items:center; justify-content:center;
  }
  .header-orbit .sphere{
    position:absolute; width:96px; height:96px; border-radius:50%;
    background:radial-gradient(circle at 35% 30%, rgba(110,160,255,.4), transparent 55%), radial-gradient(circle at 65% 70%, rgba(20,30,60,.95), #060912 70%);
    border:1px solid rgba(120,170,255,.3);
    box-shadow:0 0 30px rgba(94,203,255,.25), inset 0 0 24px rgba(0,0,0,.6);
  }
  .header-orbit .ring{
    position:absolute; width:140px; height:46px; border-radius:50%;
    border:2px solid var(--cyan);
    transform:rotate(-18deg);
    box-shadow:0 0 12px rgba(111,212,255,.8);
    animation:spin 10s linear infinite;
  }
  .header-orbit .ring::after{
    content:''; position:absolute; top:50%; right:-4px; width:7px; height:7px; border-radius:50%;
    background:#eafcff; box-shadow:0 0 10px 3px rgba(160,225,255,1); transform:translateY(-50%);
  }
  .header-orbit .letters{
    position:relative; z-index:2;
    display:flex; align-items:center; gap:2px;
    font-family:'Inter',sans-serif;
    font-weight:800;
    font-size:30px;
    letter-spacing:-1px;
    background:linear-gradient(180deg, #ffffff 0%, #cdd8ea 45%, #8e9bb8 100%);
    -webkit-background-clip:text; -webkit-text-fill-color:transparent; background-clip:text;
    filter:drop-shadow(0 1px 4px rgba(0,0,0,.6));
  }
  .header-orbit .letters .spark{
    width:4px; height:4px;
    background:#7fd8ff;
    transform:rotate(45deg);
    box-shadow:0 0 8px 2px rgba(127,216,255,.9);
    -webkit-text-fill-color:initial;
  }
  @keyframes spin{ to{ transform:rotate(342deg); } }

  /* rest of original CSS unchanged... (kept as before) */
</style>
</head>
<body>

<canvas id="particles"></canvas>
<div class="ambient"></div>

<nav class="topnav">
  <a href="home.html" class="logo"><span class="dot"></span>BrandOrbitX</a>
  <div style="display:flex; align-items:center; gap:20px;">
    <a href="pricing.html" class="back"><i class="fas fa-tag"></i> Pricing</a>
    <a href="home.html" class="back"><i class="fas fa-arrow-left"></i> Home</a>
  </div>
</nav>

<!-- original body content remains unchanged -->

<footer><p>© 2026 BrandOrbitX | All Rights Reserved</p></footer>

<script>
  // PARTICLES (copied from home.html)
  const canvas = document.getElementById('particles');
  const ctx = canvas.getContext('2d');
  let W, H, particles = [];
  function resize(){ W = canvas.width = window.innerWidth; H = canvas.height = window.innerHeight; }
  resize();
  window.addEventListener('resize', resize);
  class Particle{
    constructor(){
      this.x = Math.random()*W; this.y = Math.random()*H;
      this.size = Math.random()*1.5+0.3;
      this.vx = (Math.random()-.5)*.3; this.vy = (Math.random()-.5)*.3;
      this.alpha = Math.random()*.6+.1;
      const c = ['rgba(124,92,255,','rgba(111,212,255,','rgba(255,107,74,','rgba(232,234,242,'];
      this.color = c[Math.floor(Math.random()*c.length)];
    }
    draw(){ ctx.beginPath(); ctx.arc(this.x,this.y,this.size,0,Math.PI*2); ctx.fillStyle=this.color+this.alpha+')'; ctx.fill(); }
    update(){
      this.x+=this.vx; this.y+=this.vy;
      if(this.x<0||this.x>W) this.vx*=-1;
      if(this.y<0||this.y>H) this.vy*=-1;
    }
  }
  particles = [];
  for(let i=0;i<90;i++) particles.push(new Particle());
  function drawLines(){
    for(let i=0;i<particles.length;i++){
      for(let j=i+1;j<particles.length;j++){
        const dx=particles[i].x-particles[j].x, dy=particles[i].y-particles[j].y;
        const d=Math.sqrt(dx*dx+dy*dy);
        if(d<120){ ctx.beginPath(); ctx.moveTo(particles[i].x,particles[i].y); ctx.lineTo(particles[j].x,particles[j].y); ctx.strokeStyle=`rgba(124,92,255,${.08*(1-d/120)})`; ctx.lineWidth=.5; ctx.stroke(); }
      }
    }
  }
  function animate(){ ctx.clearRect(0,0,W,H); particles.forEach(p=>{p.update();p.draw();}); drawLines(); requestAnimationFrame(animate); }
  animate();
</script>
</body>
</html>
